name: PR Dev Deployment Status

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_run:
    workflows: ["Deploy Dev"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  deployment-status:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Find related PR
        id: find-pr
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: headSha,
            });

            const pr = prs.data.find((item) => item.state === 'open');
            core.setOutput('number', pr ? String(pr.number) : '');

      - name: Exit when no PR is associated
        if: steps.find-pr.outputs.number == ''
        run: echo "No open PR is associated with this deployment commit."

      - name: Fail when deploy workflow failed
        if: steps.find-pr.outputs.number != '' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "Deploy Dev did not succeed."
          exit 1

      - name: Pass when deploy workflow succeeded
        if: steps.find-pr.outputs.number != '' && github.event.workflow_run.conclusion == 'success'
        run: echo "Deploy Dev completed successfully for the associated pull request."
