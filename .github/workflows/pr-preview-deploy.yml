name: PR Preview Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  app-tests:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/app-tests.yml
    with:
      test-ref: ${{ github.event.pull_request.head.sha }}

  e2e-tests:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/e2e-tests.yml
    with:
      test-ref: ${{ github.event.pull_request.head.sha }}

  preview-deploy:
    name: Preview Deployment
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [app-tests, e2e-tests]
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment-name: dev
      azure-environment-name: dev
      deploy-ref: ${{ github.event.pull_request.base.sha }}
      transient-environment: true
    secrets: inherit

  comment:
    name: Preview Deployment Comment
    needs: [preview-deploy]
    runs-on: ubuntu-latest
    if: ${{ needs.preview-deploy.outputs.deployment-url != '' }}
    env:
      DEPLOYMENT_URL: ${{ needs.preview-deploy.outputs.deployment-url }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      DEPLOYED_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Create or update PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const commitSha = process.env.COMMIT_SHA;
            const deployedSha = process.env.DEPLOYED_SHA;
            const marker = '<!-- pr-preview-deployment -->';
            const body = [
              marker,
              `Preview deployment is live: ${deploymentUrl}`,
              '',
              'Azure environment: dev',
              `Tested PR commit: ${commitSha}`,
              `Deployed trusted base commit: ${deployedSha}`,
              '',
              'This workflow validates the pull request commit, but the deployment itself uses the base branch commit so Azure secrets are not exposed to untrusted PR code.',
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.data.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
