name: PR Dev Deployment Comment

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_run:
    workflows: ["Deploy Dev"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Find related PR
        id: find-pr
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: headSha,
            });

            const pr = prs.data.find((item) => item.state === 'open');
            core.setOutput('number', pr ? String(pr.number) : '');

      - name: Skip when no PR is associated
        if: steps.find-pr.outputs.number == ''
        run: echo "No open PR is associated with this deployment commit."

      - name: Download workflow artifact metadata
        if: steps.find-pr.outputs.number != ''
        id: deployment-link
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run.id;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
            });

            const artifact = artifacts.data.artifacts.find((item) => item.name === 'dev-deployment-url');
            if (!artifact) {
              core.setOutput('url', '');
              return;
            }

            const download = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });

            const fs = require('fs');
            const path = require('path');
            const os = require('os');
            const AdmZip = require('adm-zip');

            const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'dev-deploy-'));
            const zipPath = path.join(tempDir, 'artifact.zip');
            fs.writeFileSync(zipPath, Buffer.from(download.data));

            const zip = new AdmZip(zipPath);
            zip.extractAllTo(tempDir, true);

            const textPath = path.join(tempDir, 'deployment-url.txt');
            const url = fs.existsSync(textPath) ? fs.readFileSync(textPath, 'utf8').trim() : '';
            core.setOutput('url', url);

      - name: Create or update PR comment
        if: steps.find-pr.outputs.number != '' && steps.deployment-link.outputs.url != ''
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number('${{ steps.find-pr.outputs.number }}');
            const deploymentUrl = '${{ steps.deployment-link.outputs.url }}';
            const marker = '<!-- dev-deployment-link -->';
            const body = [
              marker,
              `Dev deployment is live: ${deploymentUrl}`,
              '',
              'Azure environment: dev',
              `Commit: ${context.payload.workflow_run.head_sha}`,
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.data.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
