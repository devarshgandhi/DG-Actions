name: Reusable Deploy Workflow

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      environment-name:
        description: GitHub Actions environment to target
        required: true
        type: string
      azure-environment-name:
        description: Azure environment name to deploy
        required: true
        type: string
      deploy-ref:
        description: Git ref to deploy (commit SHA, tag, or branch)
        required: false
        type: string
        default: ''
    outputs:
      deployment-url:
        description: Deployed application URL
        value: ${{ jobs.deploy.outputs.deployment-url }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.capture-url.outputs.deployment-url }}
    environment: ${{ inputs.environment-name }}
    concurrency:
      group: deploy-${{ inputs.environment-name }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy-ref || github.sha }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --federated-credential-provider "github" \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Deploy application
        run: azd up --no-prompt
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENV_NAME: ${{ inputs.azure-environment-name }}
          AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}

      - name: Capture deployment URL
        id: capture-url
        run: |
          deployment_url="$(azd env get-value SERVICE_WEB_URI 2>/dev/null || true)"

          if [ -z "$deployment_url" ]; then
            deployment_url="$(azd env get-value WEB_URI 2>/dev/null || true)"
          fi

          if [ -z "$deployment_url" ]; then
            deployment_url="$(azd env get-value FRONTEND_ENDPOINT 2>/dev/null || true)"
          fi

          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Write deployment URL artifact
        if: ${{ steps.capture-url.outputs.deployment-url != '' }}
        run: printf '%s' "${{ steps.capture-url.outputs.deployment-url }}" > deployment-url.txt

      - name: Upload deployment URL artifact
        if: ${{ steps.capture-url.outputs.deployment-url != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.environment-name }}-deployment-url
          path: deployment-url.txt
          retention-days: 7
