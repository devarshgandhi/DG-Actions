name: Reusable Deploy Workflow

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      environment-name:
        description: GitHub Actions environment to target
        required: true
        type: string
      azure-environment-name:
        description: Azure environment name to deploy
        required: true
        type: string
      deploy-ref:
        description: Git ref to deploy (commit SHA, tag, or branch)
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    concurrency:
      group: deploy-${{ inputs.environment-name }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.deploy-ref || github.sha }}

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --federated-credential-provider "github" \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Deploy application
        run: azd up --no-prompt
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENV_NAME: ${{ inputs.azure-environment-name }}
          AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
